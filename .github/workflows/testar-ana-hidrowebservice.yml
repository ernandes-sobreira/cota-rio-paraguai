name: Validar API ANA HidroWebService (manual, sem publicar dados)
on:
  workflow_dispatch:
    inputs:
      station:
        description: "Código ANA da estação (ex.: Cáceres)"
        required: true
        default: "66070004"
permissions:
  contents: read
jobs:
  test-ana:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar presença das credenciais, sem expor valores
        env:
          ANA_IDENTIFICADOR: ${{ secrets.ANA_IDENTIFICADOR }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}
        run: |
          test -n "$ANA_IDENTIFICADOR" && test -n "$ANA_SENHA" || { echo "::error::Configure os secrets ANA_IDENTIFICADOR e ANA_SENHA"; exit 1; }
      - name: Consultar dados adotados ANA (somente metadados)
        env:
          ANA_IDENTIFICADOR: ${{ secrets.ANA_IDENTIFICADOR }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}
          STATION: ${{ inputs.station }}
        run: node scripts/ana_hidrowebservice.mjs "$STATION"
